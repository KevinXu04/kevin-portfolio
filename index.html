<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Kevin Xiu - Software Developer Portfolio. React, Node.js, and more." />
    <meta name="theme-color" content="#f6f7f7" />
    <!-- Sets the theme before first paint to avoid a flash of the wrong theme.
         Saved choice wins, then the system preference, otherwise light. -->
    <script>
      (function () {
        var theme = "light";
        try {
          var saved = localStorage.getItem("theme");
          if (saved === "light" || saved === "dark") theme = saved;
          else if (window.matchMedia("(prefers-color-scheme: dark)").matches) theme = "dark";
        } catch (e) {}
        document.documentElement.dataset.theme = theme;
        // Same language rule as src/i18n/language.js, applied before React loads
        var lang = "en";
        try {
          var savedLang = localStorage.getItem("lang");
          if (savedLang === "en" || savedLang === "nl") lang = savedLang;
          else if ((navigator.languages || [navigator.language]).some(function (l) { return /^nl/i.test(l); })) lang = "nl";
        } catch (e) {}
        document.documentElement.lang = lang;
      })();
    </script>
    <link rel="preload" as="image" href="/projects/tradein.webp" type="image/webp" fetchpriority="high" />
